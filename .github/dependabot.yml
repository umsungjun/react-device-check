version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: '/examples/basic'
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: '/examples/nextjs'
    schedule:
      interval: weekly

  # The docs site is deployed, so it needs security updates as much as the package does.
  - package-ecosystem: npm
    directory: '/website'
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
